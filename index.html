<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun7 x Origin - Boss de guilde</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="./content/css/layout.css" rel="stylesheet" />

    <!-- Bootstrap JS (bundle avec Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-2.2.4.min.js"
        integrity="sha256-BbhdlvQf/xTY9gja0Dq3HiwQF8LaCRTXxZKRutelT44=" crossorigin="anonymous"></script>

    <!-- Custom scripts -->
    <script src="./scripts/origin-guild-boss-calculator.js"></script>
</head>

<body>
    <header class="navbar navbar-expand-lg">
        <div class="container pb-2 border-bottom">
            <a class="align-items-center d-flex gap-2 navbar-brand" href="#">
                <div class="overflow-hidden rounded-circle border border-2 border-light-subtle">
                    <img src="https://avatars.githubusercontent.com/u/163908406?v=4" alt="U-Jey" width="40" height="40">
                </div>
                <span class="fs-4"><b>Sun7</b> <sup class="opacity-50 fs-6 fst-italic">Origin</sup></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="nav nav-pills ms-auto align-items-lg-center py-2">
                    <li class="nav-item"><a href="#" class="nav-link active">Boss de guilde</a></li>
                    <!-- <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
<button id="themeToggle" type="button" class="btn btn-outline-light btn-sm">
  🌙 Mode sombre
</button>
</li> -->
                </ul>
            </div>
        </div>
    </header>

    <!-- BODY -->
    <main class="container py-4">

        <!-- Bloc de description -->
        <section class="mb-4">
            <h1 class="h4">Formule de calcul</h1>
            <p class="text-muted">
                Pour déterminer le niveau et les PV à retirer, le calcul est <i>(pour l'instant)</i> très simple :
                <span
                    class="badge bg-warning-subtle border border-warning-subtle text-warning-emphasis rounded-pill fs-6">
                    <math display="inline">
                        <mrow>
                            <mn>Score</mn>
                            <mo>&times;</mo>
                            <mn>10 000</mn>
                            <mo>=</mo>
                            <mn>Total de dégâts à infliger</mn>
                        </mrow>
                    </math>
                </span>
            </p>
        </section>

        <section class="mb-4">
            <div class="row justify-content-center align-items-start align-items-md-baseline">
                <!-- Champ numérique -->
                <div class="col-12 order-2 mb-4 col-md-5 order-md-1 mb-md-0 ">
                    <div class="d-flex align-items-center gap-4">
                        <label for="scoreInput" class="form-label fs-4" style="white-space: nowrap;">Score visé</label>
                        <input type="number" class="form-control" id="scoreInput" placeholder="Entrez une valeur"
                            value="0" />
                    </div>

                    <div class="d-flex flex-wrap justify-content-center mt-2 gap-1">
                        <button class="btn btn-dark rounded-2 px-3 btn-target-score" type="button"
                            data-target-score="0">Min.</button>
                        <button class="btn btn-dark rounded-2 px-3 btn-target-score" type="button"
                            data-target-score="3333">3333</button>
                        <button class="btn btn-dark rounded-2 px-3 btn-target-score" type="button"
                            data-target-score="5000">5000</button>
                        <button class="btn btn-dark rounded-2 px-3 btn-target-score" type="button"
                            data-target-score="10000">10000</button>
                        <button class="btn btn-dark rounded-2 px-3 btn-target-score" type="button"
                            data-target-score="63156">Max.</button>
                    </div>
                </div>

                <!-- Zone de résultat -->
                <div class="col-12 order-1 col-md-7 order-md-2">
                    <div class="card mb-4 rounded-3 shadow-sm">
                        <div class="card-header py-3">
                            <h4 class="my-0 fw-normal">Étape du combat à atteindre</h4>
                        </div>
                        <div class="card-body">
                            <div class="d-flex align-items-center gap-4">
                                <span style="min-width: 46px;">Nv. <b class="bdg-level">1</b></span>
                                <div class="bdg-health-gauge flex-grow-1 rounded-2 border-2 border border-light-subtle">
                                    <div class="bdg-health-current-level rounded-1" style="width: 100%;"></div>
                                </div>
                            </div>
                            <div class="fst-italic opacity-50" style="max-width: calc(100% - 8px); text-align: right;">
                                <span class="bdg-health-current-percentage">100</span> %
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Points par niveau -->
                <div class="col-12 order-0 col-md-7 order-md-3" style="margin-left: auto;">
                    <div class="card mb-4 rounded-3 shadow-sm">
                        <div class="card-header py-3 d-flex align-items-center" data-bs-toggle="collapse"
                            href="#collapseExample">
                            <h4 class="my-0 fw-normal flex-grow-1">Points par niveau</h4>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-hand-index-fill" viewBox="0 0 16 16">
                                <path
                                    d="M8.5 4.466V1.75a1.75 1.75 0 1 0-3.5 0v5.34l-1.2.24a1.5 1.5 0 0 0-1.196 1.636l.345 3.106a2.5 2.5 0 0 0 .405 1.11l1.433 2.15A1.5 1.5 0 0 0 6.035 16h6.385a1.5 1.5 0 0 0 1.302-.756l1.395-2.441a3.5 3.5 0 0 0 .444-1.389l.271-2.715a2 2 0 0 0-1.99-2.199h-.581a5 5 0 0 0-.195-.248c-.191-.229-.51-.568-.88-.716-.364-.146-.846-.132-1.158-.108l-.132.012a1.26 1.26 0 0 0-.56-.642 2.6 2.6 0 0 0-.738-.288c-.31-.062-.739-.058-1.05-.046z" />
                            </svg>
                        </div>
                        <div class="card-body collapse" id="collapseExample">
                            <div class="table-responsive" style="min-height: 230px; max-height: 40vh;">
                                <table class="table text-center">
                                    <thead>
                                        <tr>
                                            <th style="width: 46px;">Nv.</th>
                                            <th>Dégâts infligés</th>
                                            <th style="width: 48px;">Points</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bdg-milestones">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

        });
    </script> -->
</body>

</html>
